{{ define "main" }}
<article>
    <header class="post-header">
        <p class="eyebrow">Blog</p>
        <h1>{{ .Title }}</h1>
        <div class="post-meta-row">
            <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "January 2, 2006" }}</time>
            <div class="post-tags" aria-label="Article topics">
                {{ range .GetTerms "tags" }}
                <a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a>
                {{ end }}
            </div>
        </div>
    </header>
    <div class="post-content">{{ .Content }}</div>
    <nav class="post-nav" aria-label="More writing">
        <a href="/archive/">View archive</a>
        {{ with .PrevInSection }}<a href="{{ .RelPermalink }}">&larr; {{ .Title }}</a>{{ end }}
        {{ with .NextInSection }}<a href="{{ .RelPermalink }}">{{ .Title }} &rarr;</a>{{ end }}
    </nav>
</article>
{{ end }}
